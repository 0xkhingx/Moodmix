# PXXL buildpack config for the MoodMix FastAPI backend (api.py).
# Gateway reads this on GitHub-backed deployments and pre-fills the build plan.
# Secrets (Spotify keys) must be set in the PXXL dashboard, NOT here.
[build]
language = "python"
framework = "fastapi"
packageManager = "pip"
runtime = "3.12"
baseDirectory = "/"
port = 8000
installCommand = "pip install --upgrade pip setuptools wheel && pip install -r requirements-api.txt && python scripts/fetch_models.py"
buildCommand = ""
startCommand = "uvicorn api:app --host 0.0.0.0 --port $PORT --workers 1 --proxy-headers --forwarded-allow-ips=* --timeout-keep-alive 5"

# librosa/soundfile need these at runtime (Debian buildpack -> apt).
[packages]
runtime = ["libsndfile1", "ffmpeg"]

[env]
PYTHONUNBUFFERED = "1"
PYTHONDONTWRITEBYTECODE = "1"
